name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LearnHub.slnx

      - name: Check formatting
        run: dotnet format LearnHub.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build LearnHub.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution LearnHub.slnx --configuration Release --no-build
