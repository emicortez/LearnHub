# Weekly update PRs, grouped so one PR per ecosystem carries the routine bumps. Security updates still arrive as
# their own PRs. Each PR goes through CI like any other change; actions are pinned by SHA and Dependabot updates the
# SHA and the version comment together.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
