schema: spec-driven
project: learnhub
strict_tdd: false
context: |
  LearnHub is a .NET 10 / ASP.NET Core 10 microservices workspace.
  Architecture: Clean Architecture per service with DDD domain rules.
  Current stack: Aspire 13.2.4 AppHost, EF Core 10, MediatR 12, FluentValidation 11, Npgsql, BCrypt.Net-Next.
  Services discovered: Identity service scaffold only; AppHost and ServiceDefaults are present.
  Conventions: value objects, aggregate roots, domain events, and error codes in {service}.{entity}.{problem}.
  Docs are authoritative: docs/architecture.md, docs/tech-stack.md, CLAUDE.md.
  No test projects or explicit lint/formatter config were found.

testing:
  strict_tdd: false
  runner:
    command: none
    framework: none
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: null
  quality:
    linter: null
    type_checker: "dotnet build"
    formatter: null

rules:
  proposal:
    - Include rollback notes for risky changes.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
  design:
    - Include sequence diagrams for complex flows.
    - Document architecture decisions with rationale.
  tasks:
    - Group by phase and use hierarchical numbering.
    - Keep tasks completable in one session.
  apply:
    - Follow existing code patterns.
    - Keep strict_tdd false until a real test runner is added.
    - test_command: ""
  verify:
    - Compare implementation against spec, design, and tasks.
    - test_command: ""
    - build_command: "dotnet build LearnHub.slnx"
    - coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
